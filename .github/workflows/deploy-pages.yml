name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-${{ vars.UBUNTU_VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies with retry
        run: |
          for i in {1..3}; do
            echo "Installation attempt $i..."
            if yarn install --immutable; then
              echo "Installation successful on attempt $i"
              break
            else
              echo "Installation failed on attempt $i"
              if [ $i -eq 3 ]; then
                echo "All installation attempts failed"
                exit 1
              fi
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
        run: yarn generate

      - name: Disable Jekyll processing
        run: touch .output/public/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .output/public
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages artifact
    runs-on: ubuntu-${{ vars.UBUNTU_VERSION }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
