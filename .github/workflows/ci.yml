name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies with retry
        run: |
          # Retry installation up to 3 times
          for i in {1..3}; do
            echo "Installation attempt $i..."
            if yarn install --immutable; then
              echo "Installation successful on attempt $i"
              break
            else
              echo "Installation failed on attempt $i"
              if [ $i -eq 3 ]; then
                echo "All installation attempts failed"
                exit 1
              fi
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

      - name: Run ESLint
        run: yarn lint

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies with retry
        run: |
          # Retry installation up to 3 times
          for i in {1..3}; do
            echo "Installation attempt $i..."
            if yarn install --immutable; then
              echo "Installation successful on attempt $i"
              break
            else
              echo "Installation failed on attempt $i"
              if [ $i -eq 3 ]; then
                echo "All installation attempts failed"
                exit 1
              fi
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

      - name: Run vue-tsc type check
        run: yarn type-check

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies with retry
        run: |
          # Retry installation up to 3 times
          for i in {1..3}; do
            echo "Installation attempt $i..."
            if yarn install --immutable; then
              echo "Installation successful on attempt $i"
              break
            else
              echo "Installation failed on attempt $i"
              if [ $i -eq 3 ]; then
                echo "All installation attempts failed"
                exit 1
              fi
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

      - name: Run unit tests
        run: yarn test:run

  security:
    name: Security Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies with retry
        run: |
          # Retry installation up to 3 times
          for i in {1..3}; do
            echo "Installation attempt $i..."
            if yarn install --immutable; then
              echo "Installation successful on attempt $i"
              break
            else
              echo "Installation failed on attempt $i"
              if [ $i -eq 3 ]; then
                echo "All installation attempts failed"
                exit 1
              fi
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

      - name: Run yarn audit (Critical only)
        run: |
          audit_exit=0
          yarn npm audit --all --json > audit.json 2> audit.stderr || audit_exit=$?
          if [ ! -s audit.json ]; then
            if [ "$audit_exit" -eq 0 ]; then
              echo "No critical vulnerabilities found. PASS."
              exit 0
            fi

            echo "yarn npm audit failed without JSON output." >&2
            cat audit.stderr >&2
            exit "$audit_exit"
          fi

          if ! jq -s 'length >= 0' audit.json > /dev/null; then
            echo "yarn npm audit produced invalid JSON." >&2
            cat audit.stderr >&2
            exit 1
          fi

          # Yarn emits JSON Lines audit advisories; npm may emit one report with vulnerabilities.
          if jq -e -s '
            any(
              .[];
              (
                .data?.advisory?.severity? == "critical"
                or .severity? == "critical"
                or (
                  (.vulnerabilities? // {})
                  | to_entries
                  | any(.value.severity? == "critical")
                )
              )
            )
          ' audit.json > /dev/null; then
            echo "Critical vulnerabilities found!"
            exit 1
          else
            echo "No critical vulnerabilities found. PASS."
          fi

  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies with retry
        run: |
          # Retry installation up to 3 times
          for i in {1..3}; do
            echo "Installation attempt $i..."
            if yarn install --immutable; then
              echo "Installation successful on attempt $i"
              break
            else
              echo "Installation failed on attempt $i"
              if [ $i -eq 3 ]; then
                echo "All installation attempts failed"
                exit 1
              fi
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

      - name: Build application
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies with retry
        run: |
          # Retry installation up to 3 times
          for i in {1..3}; do
            echo "Installation attempt $i..."
            if yarn install --immutable; then
              echo "Installation successful on attempt $i"
              break
            else
              echo "Installation failed on attempt $i"
              if [ $i -eq 3 ]; then
                echo "All installation attempts failed"
                exit 1
              fi
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .output/

      - name: Install Playwright browsers
        run: yarn test:e2e:install

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Run Playwright tests
        run: yarn test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies with retry
        run: |
          # Retry installation up to 3 times
          for i in {1..3}; do
            echo "Installation attempt $i..."
            if yarn install --immutable; then
              echo "Installation successful on attempt $i"
              break
            else
              echo "Installation failed on attempt $i"
              if [ $i -eq 3 ]; then
                echo "All installation attempts failed"
                exit 1
              fi
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .output/

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  cleanup:
    name: Cleanup Artifacts
    runs-on: ubuntu-24.04
    needs: [build, e2e-tests, codeql]
    if: always() && needs.build.result == 'success'
    permissions:
      actions: write

    steps:
      - name: Delete build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh CLIを使用してアーティファクトを削除
          ARTIFACT_NAME="build-output"
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"

          # アーティファクト一覧を取得（エラーハンドリング付き）
          if ! RESPONSE=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" 2>&1); then
            echo "Failed to fetch artifacts: ${RESPONSE}"
            echo "Skipping artifact deletion."
            exit 0
          fi

          # この実行の中で指定された名前のアーティファクトIDを取得
          # (同じrun_idの中では同じ名前のアーティファクトは1つのみ)
          ARTIFACT_ID=$(echo "$RESPONSE" | \
            jq -r ".artifacts[] | \
              select(.name == \"${ARTIFACT_NAME}\") | .id" | head -n1)

          if [ -n "$ARTIFACT_ID" ] && [ "$ARTIFACT_ID" != "null" ]; then
            echo "Deleting artifact ${ARTIFACT_NAME} (ID: ${ARTIFACT_ID})..."
            if gh api -X DELETE "repos/${REPO}/actions/artifacts/${ARTIFACT_ID}" > /dev/null 2>&1; then
              echo "Artifact deleted successfully."
            else
              echo "Failed to delete artifact"
              echo "Continuing anyway (failOnError: false)"
            fi
          else
            echo "Artifact ${ARTIFACT_NAME} not found. Skipping deletion."
          fi
